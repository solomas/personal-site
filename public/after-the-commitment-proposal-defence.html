  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"fc7f3fb0-2c06-4b55-a184-dd5346951067\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ba5fbc08-d0fe-41a7-a65e-014a3cf0ff45\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<!--\n  ============================================================================\n  EDITING GUIDE\n  ----------------------------------------------------------------------------\n  ACCENT COLOUR    Change   --accent    in :root below. One place, deck-wide.\n  BASE / INK       Change   --base / --ink  in :root.\n  TYPEFACE         Change   --sans      in :root (and Google Fonts link above).\n  TYPE SIZES       Change   --type-*    tokens in :root.\n\n  SLIDE TEXT       Each slide is a <section class=\"slide s#\"> ... <\u002Fsection>\n                   block in the .stage container. Find the slide number, edit\n                   the text in place.\n  SLIDE ORDER      Rearrange the <section> blocks in the .stage container.\n                   The slide counter and big numerals update automatically.\n\n  FULL-SCREEN      Press F while the deck is in focus, or use the browser's\n                   View > Full Screen menu. Esc exits.\n  NAVIGATION       Left / Right arrow keys, PageUp / PageDown, or Space.\n                   Home / End jump to the first / last slide. Click the right\n                   or left half of the screen on touch.\n\n  SLIDE 8 GLOBE    The globe defaults to true 3D (Three.js). If it stutters in\n                   the presentation room, switch to the 2D fallback in either\n                   of these ways:\n                     (1) Click the small  3D  /  2D  toggle in the bottom-left\n                         corner of slide 8 itself.\n                     (2) Open the page with the URL parameter ?globe=2d, e.g.\n                         \"Proposal Defence.html?globe=2d\". This locks the\n                         deck to the 2D map for the whole session.\n                   The 2D fallback is a clean equirectangular world map with\n                   the same three pulsing points.\n  ============================================================================\n-->\n\n<style>\n  :root {\n    /* ---- Palette ----------------------------------------------------- */\n    --base:    #EFEBE2;          /* warm paper, off-white */\n    --base-2:  #E5E0D4;          /* slightly deeper paper, for contrast wells */\n    --ink:     #15110C;          /* deep warm black, near-ink */\n    --ink-80:  #15110CCC;\n    --ink-60:  #15110C99;\n    --ink-40:  #15110C66;\n    --muted:   #6B6157;          /* secondary type */\n    --rule:    #6B6157;          /* hairline rules — warm taupe */\n    --rule-2:  #6B615766;        /* very faint hairlines (same hue, softened) */\n    --accent:  #656565;          /* neutral graphite — the only accent */\n    --accent-tint: #65656514;\n\n    /* ---- Type -------------------------------------------------------- */\n    --sans: \"Inter\", \"Söhne\", \"Helvetica Neue\", Arial, sans-serif;\n    --weight-body:    400;\n    --weight-heavy:   800;\n\n    --type-title:     108px;     /* title slide hero */\n    --type-hero:       92px;     /* research question */\n    --type-section:    60px;     /* slide titles */\n    --type-large:      52px;     /* statement text */\n    --type-body:       28px;\n    --type-small:      24px;\n    --type-caption:    20px;\n    --type-label:      16px;     /* uppercase eyebrow */\n\n    /* ---- Layout (12-col grid) --------------------------------------- */\n    --pad-x: 160px;\n    --pad-y: 110px;\n    --col-gap: 28px;\n\n    /* Big slide numeral */\n    --num-size:        220px;\n    --num-weight:      800;\n    --num-tracking:    -0.04em;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body {\n    width: 100%; height: 100%; overflow: hidden;\n    background: #08070a; color: var(--ink);\n    font-family: var(--sans); font-weight: var(--weight-body);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    font-feature-settings: \"kern\", \"ss01\", \"cv11\", \"tnum\";\n    font-variant-numeric: tabular-nums;\n  }\n\n  /* ===== Stage scaffold ============================================= */\n  .stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; }\n  .stage {\n    position: relative;\n    width: 1920px; height: 1080px;\n    background: var(--base);\n    overflow: hidden;\n    transform-origin: center center;\n  }\n\n  /* ===== Deck chrome ================================================ */\n  .counter {\n    position: absolute; right: 56px; bottom: 44px;\n    font-size: 18px; color: var(--muted);\n    font-variant-numeric: tabular-nums;\n    letter-spacing: 0.18em;\n    z-index: 60;\n    font-weight: 500;\n  }\n  .progress {\n    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;\n    background: transparent;\n    z-index: 60;\n  }\n  .progress > span {\n    display: block; height: 100%;\n    background: var(--accent);\n    transition: width 320ms cubic-bezier(.6,.0,.2,1);\n  }\n  .nav-hint {\n    position: absolute; left: 56px; bottom: 44px;\n    font-size: 14px; color: var(--muted);\n    letter-spacing: 0.18em; text-transform: uppercase;\n    z-index: 60;\n    font-weight: 500;\n  }\n  .nav-hint .k {\n    display: inline-block; min-width: 24px; text-align: center;\n    border: 1px solid var(--rule); padding: 1px 6px; margin: 0 2px;\n    border-radius: 2px;\n    font-size: 13px;\n    color: var(--ink-60);\n  }\n\n  /* Persistent thin top rule, one of the Swiss devices */\n  .top-rule {\n    position: absolute; left: var(--pad-x); right: var(--pad-x); top: 56px;\n    height: 1px; background: var(--rule);\n    z-index: 5;\n  }\n  .top-mark {\n    position: absolute; top: 24px; left: var(--pad-x);\n    font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--muted); font-weight: 500;\n    z-index: 6;\n  }\n  .top-mark .sep { color: var(--ink-40); margin: 0 12px; }\n  .top-mark .accent-dot {\n    display: inline-block; width: 7px; height: 7px;\n    background: var(--accent); border-radius: 50%;\n    transform: translateY(-1px);\n    margin-right: 10px;\n  }\n\n  /* ===== Slide base ================================================== */\n  .slide {\n    position: absolute; inset: 0;\n    padding: 92px var(--pad-x) 84px;\n    display: flex; flex-direction: column;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 520ms cubic-bezier(.4,0,.2,1);\n    overflow: hidden;\n  }\n  .slide.active {\n    opacity: 1;\n    pointer-events: auto;\n  }\n  /* During a transition the outgoing slide stays composed (still .active)\n     and simply dissolves out, giving a soft diagrammatic cross-fade. */\n  .slide.leaving {\n    opacity: 0;\n    pointer-events: none;\n  }\n\n  /* ===== Big graphic numeral (the recurring Swiss flourish) ========= */\n  .big-num { display: none !important; }\n  .big-num {\n    position: absolute;\n    font-family: var(--sans);\n    font-weight: var(--num-weight);\n    font-size: var(--num-size);\n    line-height: 0.82;\n    letter-spacing: var(--num-tracking);\n    color: var(--ink-40);\n    font-variant-numeric: tabular-nums;\n    z-index: 1;\n    pointer-events: none;\n  }\n  .big-num.tl { top: 40px;  left: -64px; }\n  .big-num.tr { top: 40px;  right: -64px; }\n  .big-num.bl { bottom: 60px; left: -64px; }\n  .big-num.br { bottom: 60px; right: -64px; }\n  .big-num.mid-r { top: 50%; right: var(--pad-x); transform: translateY(-50%); }\n  .big-num.accent { color: var(--accent); }\n  .big-num.small  { font-size: 160px; line-height: 0.82; }\n  .big-num.tiny   { font-size: 120px; line-height: 0.82; }\n  .big-num.xl     { font-size: 380px; line-height: 0.82; }\n\n  /* The numeral arrives with the slide — a quiet diagrammatic count-in. */\n  .slide .big-num { opacity: 0; transform: translateY(12px); }\n  .slide.active .big-num { animation: rUpSm 780ms cubic-bezier(.2,.6,.2,1) 140ms forwards; }\n\n  .big-num .sub {\n    display: block;\n    font-size: 14px; letter-spacing: 0.24em;\n    text-transform: uppercase;\n    font-weight: 500;\n    color: var(--muted);\n    margin-top: 18px;\n    line-height: 1.4;\n  }\n\n  /* ===== Reveal primitives ========================================== */\n  @keyframes rUp       { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n  @keyframes rUpSm     { from { opacity: 0; transform: translateY(8px);  } to { opacity: 1; transform: none; } }\n  @keyframes rUpFar    { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }\n  @keyframes rDown     { from { opacity: 0; transform: translateY(-14px);} to { opacity: 1; transform: none; } }\n  @keyframes rLeft     { from { opacity: 0; transform: translateX(-24px);} to { opacity: 1; transform: none; } }\n  @keyframes rRight    { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }\n  @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes fadeOut   { from { opacity: 1; } to { opacity: 0; } }\n  @keyframes growX     { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes growY     { from { transform: scaleY(0); } to { transform: scaleY(1); } }\n  @keyframes growXIn   { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }\n  @keyframes growY     { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }\n  @keyframes drawAxis  { from { stroke-dashoffset: 1640; } to { stroke-dashoffset: 0; } }\n  @keyframes drawLine  { from { stroke-dashoffset: var(--dash, 600); } to { stroke-dashoffset: 0; } }\n  @keyframes pulse     { 0% { transform: scale(1); opacity: 0.55; }\n                         70% { transform: scale(2.4); opacity: 0; }\n                         100% { transform: scale(2.4); opacity: 0; } }\n\n  /* Generic reveal item: any .r inside an active slide animates with rUp. */\n  .r        { opacity: 0; transform: translateY(14px); }\n  .r.d0     { animation-delay:  250ms; }\n  .r.d1     { animation-delay:  540ms; }\n  .r.d2     { animation-delay:  850ms; }\n  .r.d3     { animation-delay: 1150ms; }\n  .r.d4     { animation-delay: 1450ms; }\n  .r.d5     { animation-delay: 1750ms; }\n  .r.d6     { animation-delay: 2050ms; }\n  .r.d7     { animation-delay: 2350ms; }\n  .slide.active .r {\n    animation-name: rUp;\n    animation-duration: 700ms;\n    animation-timing-function: cubic-bezier(.2,.6,.2,1);\n    animation-fill-mode: forwards;\n  }\n  /* The typing slide (s3), the research-model slide and the globe slide (s8)\n     keep their own carefully-tuned timing — restore their reveal speed. */\n  .s3.active .r, .s-model.active .r, .s8.active .r { animation-duration: 600ms; }\n  .s3 .r.d0, .s8 .r.d0 { animation-delay: 200ms; }\n  .s8 .r.d1 { animation-delay: 450ms; }\n  .s8 .r.d2 { animation-delay: 700ms; }\n\n  /* Typographic primitives */\n  .eyebrow {\n    font-size: var(--type-label);\n    text-transform: uppercase;\n    letter-spacing: 0.24em;\n    color: var(--muted);\n    font-weight: 500;\n  }\n  .accent-bar {\n    display: inline-block; width: 48px; height: 2px;\n    background: var(--accent); vertical-align: middle;\n    margin-right: 16px; transform: translateY(-3px);\n  }\n  .caption { font-size: var(--type-caption); color: var(--muted); }\n  .ink-accent { color: var(--accent); }\n\n  /* The 12-column grid container — used inside slides as needed */\n  .grid12 {\n    display: grid;\n    grid-template-columns: repeat(12, 1fr);\n    gap: 0 var(--col-gap);\n  }\n\n  /* ==================================================================\n     SLIDE 1  TITLE\n     ================================================================== */\n  .s1 { justify-content: center; padding-left: var(--pad-x); padding-right: var(--pad-x); }\n  .s1 .s1-logo { display: block; width: 300px; height: auto; margin-bottom: 46px; }\n  .s1 .s1-marker {\n    font-size: 16px; letter-spacing: 0.28em; text-transform: uppercase;\n    color: var(--muted); margin-bottom: 56px; font-weight: 500;\n  }\n  .s1 .s1-marker .dot { display:inline-block; width:7px; height:7px; background:var(--accent); border-radius:50%; margin-right:16px; transform:translateY(-1px); }\n  .s1 h1 {\n    font-size: var(--type-title);\n    line-height: 1.02;\n    font-weight: var(--weight-heavy);\n    letter-spacing: -0.025em;\n    max-width: 1500px;\n    text-wrap: balance;\n  }\n  .s1 .s1-sub {\n    margin-top: 28px; max-width: 1180px;\n    font-size: 30px; line-height: 1.32; font-weight: 400;\n    color: var(--muted); text-wrap: balance;\n  }\n  .s1 .meta {\n    margin-top: 96px;\n    display: grid;\n    grid-template-columns: auto 1fr;\n    column-gap: 60px; row-gap: 20px;\n    font-size: 26px;\n    max-width: 1100px;\n  }\n  .s1 .meta dt { color: var(--muted); font-size: 15px; text-transform: uppercase; letter-spacing: 0.22em; padding-top: 8px; font-weight: 500; }\n  .s1 .meta dd { color: var(--ink); }\n  .s1 .s1-rule { width: 64px; height: 2px; background: var(--accent); margin-bottom: 48px; transform-origin: left; transform: scaleX(0); }\n  .s1.active .s1-rule { animation: growX 840ms cubic-bezier(.2,.6,.2,1) 250ms forwards; }\n\n  /* ==================================================================\n     SLIDE 2  PROBLEM\n     ================================================================== */\n  .s2 .s2-head { margin-bottom: 80px; }\n  .s2 .split {\n    display: grid; grid-template-columns: 1fr 1px 1fr;\n    column-gap: 96px;\n    align-items: start;\n    margin-top: 60px;\n  }\n  .s2 .col h3 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.24em; color: var(--muted); font-weight: 500; margin-bottom: 36px; }\n  .s2 .col p  { font-size: var(--type-large); line-height: 1.18; font-weight: var(--weight-body); max-width: 580px; text-wrap: pretty; letter-spacing: -0.012em; }\n  .s2 .col.right strong { color: var(--accent); font-weight: var(--weight-heavy); }\n  .s2 .divider {\n    background: var(--rule); width: 1px; align-self: stretch;\n    transform-origin: top;\n    transform: scaleY(0); opacity: 0;\n  }\n  .s2.active .divider { animation: growY 1080ms cubic-bezier(.2,.6,.2,1) 500ms forwards; }\n  .s2 .col.left  { opacity: 0; transform: translateX(-24px); }\n  .s2 .col.right { opacity: 0; transform: translateX(24px); }\n  .s2.active .col.left  { animation: rLeft  840ms cubic-bezier(.2,.6,.2,1) 250ms forwards; }\n  .s2.active .col.right { animation: rRight 840ms cubic-bezier(.2,.6,.2,1) 620ms forwards; }\n  .s2 .citation { margin-top: 100px; }\n\n  /* ==================================================================\n     SLIDE 3  RESEARCH QUESTION  (the hero)\n     ================================================================== */\n  .s3 { padding-top: 92px; padding-bottom: 84px; justify-content: flex-start; }\n  .s3 .head { margin-bottom: 96px; }\n  .s3 .gap-stage { position: relative; min-height: 480px; }\n  .s3 .gap-line {\n    position: absolute; top: 0; left: 0;\n    font-size: 30px; line-height: 1.35;\n    color: var(--muted);\n    max-width: 1300px;\n    opacity: 0;\n    transform: translateY(0);\n  }\n  .s3 .gap-line .clause { display: inline-block; }\n  .s3 .gap-line .clause + .clause { margin-left: 16px; }\n  .s3.active .gap-line {\n    animation: fadeIn 600ms ease 300ms forwards,\n               fadeOut 700ms cubic-bezier(.2,.6,.2,1) 1700ms forwards;\n  }\n  .s3 .question {\n    position: absolute; top: 0; left: 0;\n    font-size: 76px;\n    line-height: 1.07;\n    font-weight: var(--weight-heavy);\n    letter-spacing: -0.028em;\n    max-width: 1500px;\n    text-wrap: balance;\n    opacity: 0;\n  }\n  /* The question is revealed by JS the moment the gap line resolves. */\n  .s3 .question.typing { opacity: 1; }\n  .s3 .question .mark { color: var(--accent); }\n  /* Typewriter: every character is pre-laid-out (so the line wrap is stable\n     and never reflows), then revealed in sequence. The caret is painted as an\n     out-of-flow bar on the most recently typed character, so advancing it\n     causes no horizontal jitter. Plain, steady, non-blinking. */\n  .s3 .question .tw-char { opacity: 0; position: relative; }\n  .s3 .question .tw-char.on { opacity: 1; }\n  .s3 .question .tw-char.cursor::after {\n    content: \"\"; position: absolute; right: -0.07em; top: 0.07em;\n    width: 3px; height: 0.82em; background: var(--ink);\n  }\n  .s3 .q-follow {\n    position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 190px;\n    max-width: 1340px;\n    font-size: 26px; line-height: 1.4; color: var(--muted);\n  }\n  .s3 .q-follow strong { color: var(--ink); font-weight: 600; }\n  .s3 .q-foot {\n    position: absolute; bottom: 84px; left: var(--pad-x);\n    font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--muted); font-weight: 500;\n    opacity: 0;\n  }\n  .s3.active .q-foot {\n    animation: fadeIn 600ms ease 3200ms forwards;\n  }\n  .s3 .q-foot .accent-bar { width: 32px; }\n\n  /* ==================================================================\n     SLIDE 4  THEORETICAL FRAMEWORK\n     ================================================================== */\n  .s4 .head { margin-bottom: 36px; display: flex; align-items: baseline; justify-content: space-between; }\n  .s4 h2 { font-size: var(--type-section); font-weight: var(--weight-heavy); letter-spacing: -0.022em; max-width: 1280px; }\n  .s4 .tier1-label, .s4 .tier2-label {\n    font-size: 16px; text-transform: uppercase; letter-spacing: 0.24em;\n    color: var(--muted); font-weight: 500; margin-bottom: 24px;\n  }\n  .s4 .tier1-label { margin-top: 80px; }\n  .s4 .tier-1 {\n    display: grid; grid-template-columns: 1fr 1fr;\n    gap: 56px;\n    margin-bottom: 56px;\n  }\n  .s4 .tier-1 .primary:last-child .claim { max-width: 580px; }\n  .s4 .primary {\n    border-top: 2px solid var(--accent);\n    padding-top: 24px;\n    padding-right: 20px;\n  }\n  .s4 .primary .src {\n    font-size: 24px;\n    color: var(--muted);\n    letter-spacing: 0.02em;\n    margin-bottom: 14px;\n    font-weight: 500;\n  }\n  .s4 .primary .role {\n    font-size: 16px;\n    text-transform: uppercase; letter-spacing: 0.22em;\n    color: var(--muted); font-weight: 500;\n    margin-bottom: 12px;\n  }\n  .s4 .primary .claim {\n    font-size: 44px;\n    line-height: 1.05;\n    font-weight: var(--weight-heavy);\n    letter-spacing: -0.022em;\n    max-width: 720px;\n  }\n  /* Connector lines between tier 1 and tier 2 */\n  .s4 .connector { position: relative; height: 56px; }\n  .s4 .connector svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }\n  .s4 .connector path { stroke: var(--rule); stroke-width: 1; fill: none; stroke-dasharray: 640; stroke-dashoffset: 640; }\n  .s4.active .connector path { animation: drawLine 1080ms cubic-bezier(.2,.6,.2,1) 1850ms forwards; --dash: 640; }\n\n  /* Centred primary-source treatment — sources align precisely above the connector */\n  .s4 .tier-1.centred .primary { text-align: center; padding-right: 0; }\n  .s4 .tier-1.centred .primary .claim { max-width: none; margin: 0 auto; }\n\n  .s4 .tier-2 {\n    display: grid; grid-template-columns: repeat(4, 1fr);\n    gap: 28px;\n  }\n  .s4 .tool {\n    border-top: 1 }\n  .s4.active .tool {\n    animation-name: rUpSm; animation-duration: 620ms;\n    animation-timing-function: cubic-bezier(.2,.6,.2,1);\n    animation-fill-mode: forwards;\n  }\n\n  /* ==================================================================\n     SLIDE 5  CASES\n     ================================================================== */\n  .s5 h2 { font-size: var(--type-section); font-weight: var(--weight-heavy); letter-spacing: -0.022em; margin-bottom: 18px; }\n  .s5 .axis-note {\n    font-size: 23px; line-height: 1.42; color: var(--muted);\n    max-width: 1580px; margin-bottom: 10px; text-wrap: pretty;\n  }\n  .s5 .axis-note strong { color: var(--ink); font-weight: 600; }\n  .s5 .grid {\n    display: flex; flex-direction: column;\n    margin-top: 24px;\n  }\n  .s5 .head-row,\n  .s5 .row {\n    display: grid;\n    grid-template-columns: 220px 1.3fr 0.85fr 1fr;\n    column-gap: 36px;\n  }\n  .s5 .head-row {\n    border-bottom: 1px solid var(--rule); padding-bottom: 20px;\n  }\n  .s5 .head-row > * {\n    font-size: 16px; text-transform: uppercase; letter-spacing: 0.18em;\n    color: var(--muted); font-weight: 500;\n  }\n  /* Every column in a row shares one baseline, with one continuous rule beneath,\n     so the set reads as even and ordered rather than staggered. */\n  .s5 .row {\n    align-items: baseline;\n    border-bottom: 1px solid var(--rule-2);\n    padding: 32px 0;\n  }\n  /* Drop the trailing rule so it doesn't cut across the big \"05\" numeral. */\n  .s5 .row:last-child { border-bottom: none; }\n  .s5 .row > * {\n    font-size: 25px; line-height: 1.34; color: var(--ink);\n  }\n  .s5 .row .case-name {\n    font-size: 46px; font-weight: var(--weight-heavy);\n    letter-spacing: -0.022em;\n    color: var(--ink);\n  }\n  .s5 .row .case-name .sub {\n    display: block;\n    font-size: 19px; color: var(--muted);\n    font-weight: 500; letter-spacing: 0.02em;\n    margin-top: 8px;\n  }\n  .s5 .row .test .verb { color: var(--accent); font-weight: var(- be-legend {\n    position: absolute; left: 8px; bottom: 8px; z-index: 5;\n    background: rgba(239,235,226,0.92);\n    border: 1px solid var(--rule-2);\n    padding: 10px 13px; max-width: 300px;\n  }\n  .s8 .globe-legend .gl-lab {\n    font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;\n    color: var(--muted); font-weight: 600; margin-bottom: 8px;\n  }\n  .s8 .globe-legend .gl-row {\n    display: flex; justify-content: space-between; gap: 18px;\n    font-size: 15px; padding: 2px 0;\n  }\n  .s8 .globe-legend .gl-name { color: var(--ink); font-weight: 600; }\n  .s8 .globe-legend .gl-val { color: var(--muted); }\n\n  /* ==================================================================\n     SLIDE 10  NEXT STEPS\n     ================================================================== */\n  .s-next h2 { font-size: var(--type-section); font-weight: var(--weight-heavy); letter-spacing: -0.022em; margin-bottom: 26px; }\n  .s-next .ns-grid {\n    display: grid; grid-template-columns: 1fr 1fr;\n    column-gap: 96px; row-gap: 48px; margin-top: 60px;\n  }\n  .s-next .ns-item {\n    display: grid; grid-template-columns: 66px 1fr; align-items: start;\n    border-top: 1px solid var(--rule); padding-top: 26px;\n  }\n  .s-next .ns-n {\n    font-size: 24px; color: var(--accent); font-weight: var(--weight-heavy);\n    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;\n  }\n  .s-next .ns-cat {\n    font-size: 16px; text-transform: uppercase; letter-spacing: 0.2em;\n    color: var(--muted); font-weight: 600; margin-bottom: 12px;\n  }\n  .s-next .ns-task { font-size: 32px; line-height: 1.26; color: var(--ink); font-weight: 500; text-wrap: pretty; }\n\n  /* Deliberate reading-order entrance. */\n  .s-next.active .r { animation-duration: 720ms; }\n  .s-next.active .ns-item.r.d2 { animation-delay: 720ms; }\n  .s-next.active .ns-item.r.d3 { animation-delay: 1080ms; }\n  .s-next.active .ns-item.r.d4 { animation-delay: 1440ms; }\n  .s-next.active .ns-item.r.d5 { an  body.no-motion .slide.active .tier2-label,\n  body.no-motion .slide.active .tool,\n  body.no-motion .slide.active .row > *,\n  body.no-motion .slide.active .head-row > *,\n  body.no-motion .slide.active .node,\n  body.no-motion .slide.active .dim.inherited,\n  body.no-motion .slide.active .dim.payoff,\n  body.no-motion .slide.active .tl .phase,\n  body.no-motion .slide.active .tl .viability,\n  body.no-motion .slide.active .annot,\n  body.no-motion .slide.active .close-statement,\n  body.no-motion .slide.active .questions,\n  body.no-motion .slide.active .big-num,\n  body.no-motion .slide.active .q-foot {\n    opacity: 1 !important;\n    transform: none !important;\n    animation: none !important;\n  }\n  body.no-motion .slide.active .divider { opacity: 1 !important; transform: scaleY(1) !important; animation: none !important; }\n  body.no-motion .slide.active .arrow   { transform: scaleX(1) !important; animation: none !important; }\n  body.no-motion .slide.active .connector path { stroke-dashoffset: 0 !important; animation: none !important; }\n  body.no-motion .slide.active .tl .axis-draw { stroke-dashoffset: 0 !important; animation: none !important; }\n  body.no-motion .slide.active .questions .ar { transform: scaleX(1) !important; animation: none !important; }\n  body.no-motion .slide.active .s1-rule,\n  body.no-motion .slide.active .s9-rule,\n  body.no-motion .slide.active .dim.payoff::before { transform: scaleX(1) !important; animation: none !important; }\n  body.no-motion .slide.active .gap-line { opacity: 0 !important; }\n  body.no-motion .slide.active .out,\n  body.no-motion .slide.active .outs-lab,\n  body.no-motion .slide.active .d5cell { opacity: 1 !important; transform: none !important; animation: none !important; }\n  body.no-motion .slide.active .link,\n  body.no-motion .slide.active .link-accent { transform: scaleY(1) !important; animation: none !important; }\n  body.no-motion .slide.active .d5cell::before { transform: scaleX(1) !important; animation: none !important; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"stage-wrap\">\n  <div class=\"stage\" id=\"stage\">\n\n    <!-- ============================================================\n         SLIDE 1  TITLE\n         ============================================================ -->\n    <section class=\"slide s1\" data-screen-label=\"01 Title\">\n      <div class=\"top-mark\">PHD PLANETARY HEALTH |&nbsp;UNIVERSIDADE DE LISBOA<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <img class=\"s1-logo r d0\" src=\"d5ad9bcd-1e54-4c2a-977f-6bf8d524261e\" alt=\"Planetary Health Doctoral Programme\" width=\"300\">\n      <div class=\"s1-rule r d0\"><\u002Fdiv>\n      <div class=\"s1-marker r d1\">JULY 3 2026<\u002Fdiv>\n      <h1 class=\"r d2\">After the commitment<\u002Fh1>\n      <p class=\"s1-sub r d2\">Brokerage, fragmentation and the politics of turning planetary health frameworks into operational governance<\u002Fp>\n      <dl class=\"meta r d3\">\n        <dt>Presenter<\u002Fdt>      <dd>Tomás van Gorp<\u002Fdd>\n        <dt>Supervisors<\u002Fdt>    <dd>Andrea Valente, Ricardo Dias<\u002Fdd>\n        <dt>Institution<\u002Fdt>    <dd>Universidade de Lisboa<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 2  PROBLEM\n         ============================================================ -->\n    <section class=\"slide s2\" data-screen-label=\"02 Problem\">\n      <div class=\"top-mark\">THE DISCONNECTION DIAGNOSIS |&nbsp;02<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">02<\u002Fdiv>\n\n      <div class=\"s2-head r d0\"><span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>Problem<\u002Fspan><\u002Fdiv>\n\n      <div class=\"split\">\n        <div class=\"col left\">\n          <h3>The evidence<\u002Fh3>\n          <p>The evidence points to the need for governance that treats health, environment, economy and justice as <em>interdependent<\u002Fem>.<\u002Fp>\n          <p class=\"caption\" style=\"margin-top: 28px;\">(Myers &amp; Frumkin, 2020; Whitmee et al., 2015)<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n        <div class=\"col right\">\n          <h3>The architecture<\u002Fh3>\n          <p>The dominant institutional architecture <strong style=\"color: rgb(101, 101, 101);\">does the opposite<\u002Fstrong>. Built on a worldview of disconnection.<\u002Fp>\n          <p class=\"caption\" style=\"margin-top: 28px;\">(Lent, 2021)<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 3  RESEARCH QUESTION AND GAP\n         ============================================================ -->\n    <section class=\"slide s3\" data-screen-label=\"03 Question\">\n      <div class=\"top-mark\">RESEARCH QUESTION |&nbsp;03<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">03<\u002Fdiv>\n\n      <div class=\"head r d0\"><span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>The gap, resolved<\u002Fspan><\u002Fdiv>\n\n      <div class=\"gap-stage\">\n        <p class=\"gap-line\">\n          <span class=\"clause\">Brokerage conditions are theorised.<\u002Fspan>\n          <span class=\"clause\">Their operation across varied governance contexts is not mapped.<\u002Fspan>\n        <\u002Fp>\n        <h1 class=\"question\">Under what conditions does strategic brokerage produce <span class=\"mark\" style=\"color: rgb(101, 101, 101);\">substantive institutional conversion<\u002Fspan> of integrative planetary health frameworks, rather than implementation stalling or fragmented adoption?<\u002Fh1>\n      <\u002Fdiv>\n\n      <p class=\"q-follow r d6\">The mechanism is <strong>second-stage brokerage<\u002Fstrong>, and <strong>cross-sectoral integration<\u002Fstrong> is the diagnostic that separates conversion from fragmented adoption.<\u002Fp>\n\n      <div class=\"q-foot\"><span class=\"accent-bar\"><\u002Fspan>The hero question of the deck<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 4  THEORETICAL FRAMEWORK\n         ============================================================ -->\n    <section class=\"slide s4\" data-screen-label=\"04 Framework\">\n      <div class=\"top-mark\">THEORETICAL FRAMEWORK |&nbsp;04<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">04<\u002Fdiv>\n\n      <div class=\"head\">\n        <div>\n          <span class=\"eyebrow r d0\"><span class=\"accent-bar\"><\u002Fspan>Primary theories and supporting theoretical tools<\u002Fspan>\n          <h2 class=\"r d1\" style=\"margin-top: 18px;\">Theoretical framework<\u002Fh2>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fmap\">\n        <div class=\"band-label r d1\">Established institutional theory<\u002Fdiv>\n        <div class=\"band r d2\">\n          <div class=\"fnode\">\n            <div class=\"fsrc\">Mahoney and Thelen (2010)<\u002Fdiv>\n            <div class=\"flabel\">Conversion, an outcome type of institutional change<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fnode\">\n            <div class=\"fsrc\">Battilana, Leca and Boxenbaum (2009)<\u002Fdiv>\n            <div class=\"flabel\">The institutional entrepreneur<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fnode\">\n            <div class=\"fsrc\">Bromley and Powell (2012)<\u002Fdiv>\n            <div class=\"flabel\">Means-ends decoupling within single organisations<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"arrows r d2\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 1600 44\" preserveAspectRatio=\"none\">\n            <path d=\"M 253 0 L 253 36 M 245 28 L 253 38 L 261 28\"><\u002Fpath>\n            <path d=\"M 800 0 L 800 36 M 792 28 L 800 38 L 808 28\"><\u002Fpath>\n            <path d=\"M 1347 0 L 1347 36 M 1339 28 L 1347 38 L 1355 28\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div class=\"band-label r d3\">This research extends<\u002Fdiv>\n        <div class=\"band r d3\">\n          <div class=\"fnode key\">\n            <div class=\"ftag\">Mechanism<\u002Fdiv>\n            <div class=\"flabel\">Second-stage brokerage, the mechanism that produces conversion<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fnode\">\n            <div class=\"ftag\">Actor<\u002Fdiv>\n            <div class=\"flabel\">The broker acting after formal commitment<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"fnode\">\n            <div class=\"ftag\">Outcome<\u002Fdiv>\n            <div class=\"flabel\">Fragmented adoption, decoupling across cross-sectoral integrative frameworks<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"converge r d4\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 1600 60\" preserveAspectRatio=\"none\">\n            <path d=\"M 253 0 L 253 26 M 800 0 L 800 26 M 1347 0 L 1347 26 M 253 26 L 1347 26 M 800 26 L 800 52 M 792 44 L 800 54 L 808 44\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n\n        <div class=\"output r d5\">\n          <div class=\"ftag\">Diagnostic<\u002Fdiv>\n          <div class=\"flabel\">Cross-sectoral integration, the diagnostic separating conversion from fragmented adoption<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tier2-label\">Supporting theoretical tools<\u002Fdiv>\n      <div class=\"tier-2\">\n        <div class=\"tool\"><div class=\"src\">Meyer and Rowan (1977)<\u002Fdiv><div class=\"what\">Decoupling<\u002Fdiv><\u002Fdiv>\n        <div class=\"tool\"><div class=\"src\">Kingdon (1984)<\u002Fdiv><div class=\"what\">Policy windows, timing<\u002Fdiv><\u002Fdiv>\n        <div class=\"tool\"><div class=\"src\">Head and Alford (2015)<\u002Fdiv><div class=\"what\">Sectoral resistance to integration<\u002Fdiv><\u002Fdiv>\n        <div class=\"tool\"><div class=\"src\">Sabatier and Weible (2007)<\u002Fdiv><div class=\"what\">Challenger coalition pressure<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 5  CASES\n         ============================================================ -->\n    <section class=\"slide s5\" data-screen-label=\"05 Cases\">\n      <div class=\"top-mark\">CASES |&nbsp;05<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">05<\u002Fdiv>\n\n      <span class=\"eyebrow r d0\" style=\"display:inline-block; margin-bottom: 24px;\"><span class=\"accent-bar\"><\u002Fspan>Three cases, three tests<\u002Fspan>\n      <h2 class=\"r d1\">Three cases<\u002Fh2>\n      <p class=\"axis-note r d1\">The cases vary by legitimacy source by design. It is the comparison axis, not random selection. The broker mobilises legitimacy as a resource: <strong>domestic legal<\u002Fstrong> in Wales, <strong>multilateral and scientific<\u002Fstrong> in Brazil, <strong>ideological and cadre<\u002Fstrong> in China.<\u002Fp>\n\n      <div class=\"grid\">\n        <div class=\"head-row\">\n          <div>Case<\u002Fdiv>\n          <div>What it is<\u002Fdiv>\n          <div>Legitimacy source<\u002Fdiv>\n          <div>What it will test<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"row row-1\">\n          <div class=\"case-name\">Wales<\u002Fdiv>\n          <div>Well-being of Future Generations Act 2015, 44 public bodies, seven goals, Commissioner.<\u002Fdiv>\n          <div>Domestic legal<\u002Fdiv>\n          <div class=\"test\"><span class=\"verb\" style=\"color: rgb(101, 101, 101)\">Whether<\u002Fspan> fragmentation is structural or a capacity issue.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"row row-2\">\n          <div class=\"case-name\">Brazil<\u002Fdiv>\n          <div>Climate and health integration, One Health committee, Belem Health Action Plan.<\u002Fdiv>\n          <div>Multilateral and scientific<\u002Fdiv>\n          <div class=\"test\"><span class=\"verb\" style=\"color: rgb(101, 101, 101)\">Whether<\u002Fspan> brokerage holds across federal ministries.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"row row-3\">\n          <div class=\"case-name\">China<span class=\"sub\">Lishui<\u002Fspan><\u002Fdiv>\n          <div>Ecological civilisation pilot, GEP accounting in cadre performance assessment.<\u002Fdiv>\n          <div>Domestic ideological and cadre incentives<\u002Fdiv>\n          <div class=\"test\"><span class=\"verb\" style=\"color: rgb(101, 101, 101)\">Whether<\u002Fspan> ideological legitimacy and cadre incentives produce integration.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 6  METHODOLOGY\n         ============================================================ -->\n    <section class=\"slide s6\" data-screen-label=\"06 Methodology\">\n      <div class=\"top-mark\">METHODOLOGY |&nbsp;06<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">06<\u002Fdiv>\n\n      <div class=\"r d0\">\n        <span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>Methodology<\u002Fspan>\n        <h2 style=\"margin-top: 18px;\">Comparative process tracing within a multiple case design<\u002Fh2>\n        <p class=\"method-name\" style=\"color: rgb(101, 101, 101)\">The brokerage episode is the unit of analysis.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"body\">\n        <div class=\"conds r d1\">\n          <div class=\"lab\">Five scope conditions<\u002Fdiv>\n          <ol>\n            <li><span>Identifiable brokers in second-stage brokerage<\u002Fspan><\u002Fli>\n            <li><span>Target institution with formal authority and sectoral organisation<\u002Fspan><\u002Fli>\n            <li><span>Integrative framework across domains<\u002Fspan><\u002Fli>\n            <li><span>Traceable process with evidence <span class=\"adm\">Admissibility<\u002Fspan><\u002Fspan><\u002Fli>\n            <li><span>Observable outcome with elapsed time <span class=\"adm\">Admissibility<\u002Fspan><\u002Fspan><\u002Fli>\n          <\u002Fol>\n          <div class=\"conds-note\">Items 04 and 05 are evidentiary admissibility criteria, not scope conditions.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"stages\">\n          <div class=\"lab r d2\">First stage to second stage<\u002Fdiv>\n          <div class=\"flow\">\n            <div class=\"node first\">\n              <div class=\"tag\">First stage<\u002Fdiv>\n              <div class=\"label\">Idea brokerage<br>frameworks circulate<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"arrow first\"><\u002Fdiv>\n            <div class=\"node second\" style=\"border-color: rgb(107, 97, 87)\">\n              <div class=\"tag\">Second stage <span style=\"font-size:11px; letter-spacing:0.18em;\">· UNIT<\u002Fspan><\u002Fdiv>\n              <div class=\"label\">Strategic brokerage<br>into target institution<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"arrow to-second\"><\u002Fdiv>\n            <div class=\"node target\">\n              <div class=\"tag\">Target<\u002Fdiv>\n              <div class=\"label\">Institution with formal<br>authority and sectoral reach<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"unit-mark r d4\" style=\"color: rgb(101, 101, 101)\"><span class=\"pip\" style=\"background-color: rgb(107, 97, 87)\"><\u002Fspan>Second-stage brokerage is what is traced.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"rivals r d6\">\n        <div class=\"rivals-col\">\n          <div class=\"rlab\">Rival hypotheses <span class=\"rsub\">(tested by sequencing analysis within each case)<\u002Fspan><\u002Fdiv>\n          <div class=\"rh\"><span class=\"rk\">R1<\u002Fspan><span>External shocks, not brokerage, drove the change.<\u002Fspan><\u002Fdiv>\n          <div class=\"rh\"><span class=\"rk\">R2<\u002Fspan><span>Deliberate resistance, not structural fragmentation, caused the failure.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rivals-div\"><\u002Fdiv>\n        <div class=\"rivals-col\">\n          <div class=\"rlab\">Falsification<\u002Fdiv>\n          <p class=\"fal\">The conversion claim fails where cross-sectoral integration is absent across the triangulation protocol, or where rival drivers (external shocks, electoral or leadership turnover, unrelated policy shifts) explain the change better than broker action.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 7  OUTCOME FRAMEWORK AND DIMENSION 5\n         ============================================================ -->\n    <section class=\"slide s7\" data-screen-label=\"07 Dimension 5\">\n      <div class=\"top-mark\">OUTCOME FRAMEWORK &nbsp;07<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">07<\u002Fdiv>\n\n      <div class=\"r d0\">\n        <span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>Outcome framework<\u002Fspan>\n        <h2 style=\"margin-top: 18px;\">Five dimensions. The fifth is the contribution.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div class=\"ofw\">\n        <!-- Measurement layer: D1 to D4, each scored on the three-point scale -->\n        <div class=\"mlayer r d1\">\n          <div class=\"layer-lab\">Measurement layer <span class=\"lsub\">D1 to D4, each scored on the three-point scale<\u002Fspan><\u002Fdiv>\n          <div class=\"dimrow\">\n            <div class=\"dimc\"><div class=\"n\">01<\u002Fdiv><div class=\"name\">Formal rules and mandates<\u002Fdiv><\u002Fdiv>\n            <div class=\"dimc\"><div class=\"n\">02<\u002Fdiv><div class=\"name\">Resource allocation<\u002Fdiv><\u002Fdiv>\n            <div class=\"dimc\"><div class=\"n\">03<\u002Fdiv><div class=\"name\">Monitoring and enforcement<\u002Fdiv><\u002Fdiv>\n            <div class=\"dimc\"><div class=\"n\">04<\u002Fdiv><div class=\"name\">Accountability<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"scalebar\">\n            <span class=\"scale-lab\">Three-point scale<\u002Fspan>\n            <span class=\"lvl top\">Substantive change<\u002Fspan>\n            <span class=\"lvl\">Procedural adoption without operational consequence<\u002Fspan>\n            <span class=\"lvl\">Symbolic adoption only<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Classifier: D5, a separate axis that reads the measurement layer -->\n        <div class=\"classifier r d3\">\n          <div class=\"cls-head\">\n            <div class=\"cls-id\"><span class=\"n\">05<\u002Fspan><span class=\"d5name\">Cross-sectoral integration<\u002Fspan><\u002Fdiv>\n            <div class=\"cls-tag\">The classifier · a separate axis<\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"cls-read\">Reads whether the D1 to D4 changes interlock across sectors. It does not sit on the three-point scale.<\u002Fp>\n          <div class=\"fan\">\n            <div class=\"branch r d4\"><div class=\"state\">Interlocking<\u002Fdiv><div class=\"barrow\" aria-hidden=\"true\"><\u002Fdiv><div class=\"outcome\">Substantive conversion<\u002Fdiv><\u002Fdiv>\n            <div class=\"branch r d5\"><div class=\"state\">Siloed<\u002Fdiv><div class=\"barrow\" aria-hidden=\"true\"><\u002Fdiv><div class=\"outcome\">Fragmented adoption<\u002Fdiv><\u002Fdiv>\n            <div class=\"branch r d6\"><div class=\"state\">Absent<\u002Fdiv><div class=\"barrow\" aria-hidden=\"true\"><\u002Fdiv><div class=\"outcome\">Implementation stalling<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 8  RESEARCH MODEL  (the analytical chain)\n         ============================================================ -->\n    <section class=\"slide s-model\" data-screen-label=\"08 Model\">\n      <div class=\"top-mark\">RESEARCH MODEL  08<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num br\">08<\u002Fdiv>\n\n      <div class=\"r d0\"><span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>Research model<\u002Fspan><\u002Fdiv>\n      <h2 class=\"r d1\">The analytical chain<\u002Fh2>\n\n      <div class=\"model-grid\">\n        <!-- The vertical analytical chain, assembled top to bottom -->\n        <div class=\"chain\">\n          <div class=\"cstep r d2\">\n            <div class=\"stage-lab\">Unit of analysis<\u002Fdiv>\n            <div class=\"node\"><div class=\"node-name\">The brokerage episode<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"link l2\"><\u002Fdiv>\n\n          <div class=\"cstep r d3\">\n            <div class=\"stage-lab\">Mechanism<\u002Fdiv>\n            <div class=\"node\"><div class=\"node-name\">Second-stage brokerage<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"link l3\"><\u002Fdiv>\n\n          <div class=\"cstep r d4\">\n            <div class=\"stage-lab\">CONDITIONS · FIVE SCOPE CONDITIONS<\u002Fdiv>\n            <div class=\"chips\">\n              <div class=\"chip\"><span class=\"ck\">C1<\u002Fspan>Identifiable brokers<\u002Fdiv>\n              <div class=\"chip\"><span class=\"ck\">C2<\u002Fspan>Authoritative target institution<\u002Fdiv>\n              <div class=\"chip\"><span class=\"ck\">C3<\u002Fspan>Integrative framework<\u002Fdiv>\n              <div class=\"chip\"><span class=\"ck\">C4<\u002Fspan>Traceable process<\u002Fdiv>\n              <div class=\"chip\"><span class=\"ck\">C5<\u002Fspan>Observable outcome with elapsed time<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"link l4\"><\u002Fdiv>\n\n          <div class=\"cstep\">\n            <div class=\"stage-lab r d5\">Outcome framework · five dimensions<\u002Fdiv>\n            <div class=\"dims4\">\n              <div class=\"dcell r d5\"><span class=\"dk\">D1<\u002Fspan><span class=\"dn\">Formal rules<\u002Fspan><\u002Fdiv>\n              <div class=\"dcell r d5\"><span class=\"dk\">D2<\u002Fspan><span class=\"dn\">Resource allocation<\u002Fspan><\u002Fdiv>\n              <div class=\"dcell r d5\"><span class=\"dk\">D3<\u002Fspan><span class=\"dn\">Monitoring and enforcement<\u002Fspan><\u002Fdiv>\n              <div class=\"dcell r d5\"><span class=\"dk\">D4<\u002Fspan><span class=\"dn\">Accountability<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"dcell d5cell\"><span class=\"dk\">D5<\u002Fspan><span class=\"dn\">Cross-sectoral integration<\u002Fspan><span class=\"dtag\">Diagnostic distinguisher<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"link-accent\"><\u002Fdiv>\n\n          <div class=\"cstep\">\n            <div class=\"stage-lab outs-lab\">The framework can produce<\u002Fdiv>\n            <div class=\"outs\">\n              <div class=\"out\">Substantive conversion<\u002Fdiv>\n              <div class=\"out\">Implementation stalling<\u002Fdiv>\n              <div class=\"out\">Fragmented adoption<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Cases: structured variation by governance type only -->\n        <div class=\"cases-col r d3\">\n          <div class=\"cases-lab\">Three cases · structured variation by legitimacy source<\u002Fdiv>\n          <div class=\"case-card\">\n            <div class=\"case-name\">Brazil<\u002Fdiv>\n            <div class=\"case-legit\">Multilateral and scientific<\u002Fdiv>\n            <div class=\"case-scale\">Federal<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"case-card\">\n            <div class=\"case-name\">Lishui, Zhejiang<\u002Fdiv>\n            <div class=\"case-legit\">Ideological and cadre<\u002Fdiv>\n            <div class=\"case-scale\">Provincial subnational<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"case-card\">\n            <div class=\"case-name\">Wales<\u002Fdiv>\n            <div class=\"case-legit\">Domestic legal<\u002Fdiv>\n            <div class=\"case-scale\">Devolved<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cases-foot\">Each case traces the same chain across a different legitimacy source. Administrative scale is a secondary descriptor.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 9  TIMELINE AND VIABILITY (with rotating globe)\n         ============================================================ -->\n    <section class=\"slide s8\" data-screen-label=\"09 Timeline\" id=\"s8\">\n      <div class=\"top-mark\">TIMELINE AND VIABILITY &nbsp;09<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num\" style=\"top: 470px; left: -116px;\">09<\u002Fdiv>\n\n      <div class=\"top-area\">\n        <div class=\"head\">\n          <span class=\"eyebrow r d0\"><span class=\"accent-bar\"><\u002Fspan>Where, then when<\u002Fspan>\n          <h2 class=\"r d1\" style=\"margin-top: 18px;\">Thirty-six month plan<\u002Fh2>\n          <p class=\"sub r d1\">Three fieldwork phases. One viability decision point at month 26.<\u002Fp>\n\n          <div class=\"where-list r d2\">\n            <div class=\"where-lab\"><span class=\"accent-dot\" style=\"background-color: rgb(107, 97, 87)\"><\u002Fspan>Fieldwork locations<\u002Fdiv>\n            <div class=\"where-row\"><span class=\"pip\" style=\"background-color: rgb(107, 97, 87)\"><\u002Fspan><span class=\"name\">Wales, United Kingdom<\u002Fspan><span class=\"latlng\">52.1°N · 3.8°W<\u002Fspan><\u002Fdiv>\n            <div class=\"where-row\"><span class=\"pip\" style=\"background-color: rgb(107, 97, 87)\"><\u002Fspan><span class=\"name\">Brazil<\u002Fspan><span class=\"latlng\">14.0°S · 51.9°W<\u002Fspan><\u002Fdiv>\n            <div class=\"where-row\"><span class=\"pip\" style=\"background-color: rgb(107, 97, 87)\"><\u002Fspan><span class=\"name\">Lishui, Zhejiang, China<\u002Fspan><span class=\"latlng\">28.5°N · 119.9°E<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"globe-area\" id=\"globe-area\">\n          <canvas class=\"globe-canvas\" id=\"globe-canvas\"><\u002Fcanvas>\n\n          <svg class=\"globe-2d\" id=\"globe-2d\" viewBox=\"0 0 460 460\" preserveAspectRatio=\"xMidYMid meet\">\n            <!-- Built dynamically by JS: equirectangular map + 3 pulsing markers -->\n          <\u002Fsvg>\n\n          <div class=\"globe-labels\" id=\"globe-labels\"><\u002Fdiv>\n\n          <div class=\"globe-legend\">\n            <div class=\"gl-lab\">Regime type · context, not the comparison axis<\u002Fdiv>\n            <div class=\"gl-row\"><span class=\"gl-name\">Wales<\u002Fspan><span class=\"gl-val\">Consolidated democracy<\u002Fspan><\u002Fdiv>\n            <div class=\"gl-row\"><span class=\"gl-name\">Brazil<\u002Fspan><span class=\"gl-val\">Emerging democracy<\u002Fspan><\u002Fdiv>\n            <div class=\"gl-row\"><span class=\"gl-name\">China<\u002Fspan><span class=\"gl-val\">Authoritarian<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"globe-toggle\">\n            <span>Globe<\u002Fspan>\n            <div class=\"seg\" role=\"tablist\">\n              <button id=\"g3d\" class=\"on\" type=\"button\">3D<\u002Fbutton>\n              <button id=\"g2d\" type=\"button\">2D<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"timeline-frame\">\n        <svg class=\"tl\" viewBox=\"0 0 1640 280\" preserveAspectRatio=\"xMidYMid me
