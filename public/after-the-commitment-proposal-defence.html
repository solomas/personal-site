186\">5 months<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Phase 2: Brazil -->\n          <g class=\"phase p2\">\n            <rect x=\"866\" y=\"84\" width=\"227\" height=\"72\" style=\"fill: rgb(107, 97, 87)\"><\u002Frect>\n            <line x1=\"866\" y1=\"84\" x2=\"866\" y2=\"156\"><\u002Fline>\n            <line x1=\"1093\" y1=\"84\" x2=\"1093\" y2=\"156\"><\u002Fline>\n            <text class=\"name\" x=\"866\" y=\"68\">Brazil<\u002Ftext>\n            <text class=\"range\" x=\"866\" y=\"186\">5 months<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Phase 3: China Lishui -->\n          <g class=\"phase p3\">\n            <rect x=\"1412\" y=\"84\" width=\"137\" height=\"72\" style=\"fill: rgb(107, 97, 87)\"><\u002Frect>\n            <line x1=\"1412\" y1=\"84\" x2=\"1412\" y2=\"156\"><\u002Fline>\n            <line x1=\"1549\" y1=\"84\" x2=\"1549\" y2=\"156\"><\u002Fline>\n            <text class=\"name\" x=\"1412\" y=\"68\">China Lishui<\u002Ftext>\n            <text class=\"range\" x=\"1412\" y=\"186\">3 months<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Viability decision point at M26 -->\n          <g class=\"viability\">\n            <line x1=\"1184\" y1=\"20\" x2=\"1184\" y2=\"120\"><\u002Fline>\n            <circle cx=\"1184\" cy=\"120\" r=\"6\"><\u002Fcircle>\n            <text class=\"lab\" x=\"1184\" y=\"14\" text-anchor=\"middle\">Viability decision<\u002Ftext>\n            <text class=\"sub\" x=\"1184\" y=\"232\" text-anchor=\"middle\">M26<\u002Ftext>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div class=\"annot\">\n        <div>\n          <span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>Viability and contingency<\u002Fspan>\n          <p style=\"margin-top: 18px;\">Each case depends on a viable access and host route. Where a route is uncertain, an emerging option is being explored, for example a Macau host for China Lishui with co-supervision and hosting on offer.<\u002Fp>\n          <p class=\"contingency\">If any route fails, the substitute must preserve that case's legitimacy source. Identifying substitutes is a next-step task.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 10  NEXT STEPS\n         ============================================================ -->\n    <section class=\"slide s-next\" data-screen-label=\"10 Next steps\">\n      <div class=\"top-mark\">NEXT STEPS | 10<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num tr\">10<\u002Fdiv>\n\n      <div class=\"r d0\"><span class=\"eyebrow\"><span class=\"accent-bar\"><\u002Fspan>What remains before fieldwork<\u002Fspan><\u002Fdiv>\n      <h2 class=\"r d1\">Next steps<\u002Fh2>\n\n      <div class=\"ns-grid\">\n        <div class=\"ns-item r d2\">\n          <div class=\"ns-n\">01<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Scale criteria<\u002Fdiv>\n            <div class=\"ns-task\">Set the criteria that demarcate each point on the three-point scale, from substantive change to symbolic adoption.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ns-item r d3\">\n          <div class=\"ns-n\">02<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Indicators<\u002Fdiv>\n            <div class=\"ns-task\">Specify observable and verifiable indicators for every dimension.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ns-item r d4\">\n          <div class=\"ns-n\">03<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Classifier protocol<\u002Fdiv>\n            <div class=\"ns-task\">Build the triangulation protocol for the D5 classifier verdict, formalising cross-sectoral integration as a mediating variable.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ns-item r d5\">\n          <div class=\"ns-n\">04<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Literature<\u002Fdiv>\n            <div class=\"ns-task\">Integrate Biermann et al. on the fragmentation of global governance architectures and Ostrom on polycentric governance.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ns-item r d6\">\n          <div class=\"ns-n\">05<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Case access<\u002Fdiv>\n            <div class=\"ns-task\">Secure a viable access and host route for each case, including the emerging Macau host for China Lishui.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ns-item r d7\">\n          <div class=\"ns-n\">06<\u002Fdiv>\n          <div class=\"ns-body\">\n            <div class=\"ns-cat\">Substitute case<\u002Fdiv>\n            <div class=\"ns-task\">Identify a substitute case that preserves ideological or state-mobilised legitimacy.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================================\n         SLIDE 9  CLOSE\n         ============================================================ -->\n    <section class=\"slide s9\" data-screen-label=\"11 Close\">\n      <div class=\"top-mark\">CLOSE |&nbsp;11<\u002Fdiv>\n      <div class=\"top-rule\"><\u002Fdiv>\n      <div class=\"big-num br\">11<\u002Fdiv>\n\n      <img class=\"close-logo r d0\" src=\"d5ad9bcd-1e54-4c2a-977f-6bf8d524261e\" alt=\"Planetary Health Doctoral Programme\" width=\"290\">\n      <div class=\"s9-rule\"><\u002Fdiv>\n      <h1 class=\"thanks r d1\">Thank you<\u002Fh1>\n      <div class=\"contribution\">\n        <div class=\"contrib-lab r d2\">The contribution<\u002Fdiv>\n        <div class=\"contrib-list\">\n          <div class=\"contrib r d3\"><span class=\"ck\">Mechanism<\u002Fspan><span class=\"ct\">The mechanism is <span class=\"accent\">second-stage brokerage<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n          <div class=\"contrib r d4\"><span class=\"ck\">Extension<\u002Fspan><span class=\"ct\">It extends <span class=\"accent\">means-ends decoupling<\u002Fspan> from single organisations to cross-sectoral integrative frameworks.<\u002Fspan><\u002Fdiv>\n          <div class=\"contrib r d5\"><span class=\"ck\">Diagnostic<\u002Fspan><span class=\"ct\"><span class=\"accent\">Cross-sectoral integration<\u002Fspan> is the diagnostic distinguisher between conversion and fragmented adoption.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"q-invite r d6\"><span class=\"accent-bar\"><\u002Fspan>Questions welcome<\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <!-- Chrome -->\n  <div class=\"counter\" id=\"counter\">01 / 10<\u002Fdiv>\n  <div class=\"progress\" aria-hidden=\"true\"><span id=\"prog\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Three.js for the slide-8 globe. CDN-pinned (r149, the last pre-deprecation UMD build).\n     -->\n<script src=\"34eae41a-363a-4b90-8f3e-8634c48f6963\"><\u002Fscript>\n\n<script>\n  /* ==================================================================\n     Stage scaling — fit 1920×1080 stage into the viewport.\n     ================================================================== */\n  const stage = document.getElementById('stage');\n  const W = 1920, H = 1080;\n  function fit() {\n    const s = Math.min(window.innerWidth / W, window.innerHeight / H);\n    if (s > 0 && Number.isFinite(s)) stage.style.transform = `scale(${s})`;\n  }\n  window.addEventListener('resize', fit);\n  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(document.documentElement);\n  fit();\n\n  /* ==================================================================\n     Motion fallback. Snap to final state in background tabs.\n     ================================================================== */\n  window.__tweakMotionOff = false;\n  function syncMotion() { document.body.classList.toggle('no-motion', document.hidden || window.__tweakMotionOff); }\n  syncMotion();\n  document.addEventListener('visibilitychange', syncMotion);\n\n  /* ==================================================================\n     Navigation\n     ================================================================== */\n  const slides  = Array.from(document.querySelectorAll('.slide'));\n  const counter = document.getElementById('counter');\n  const prog    = document.getElementById('prog');\n  let idx = 0;\n  const pad2 = n => (n < 10 ? '0' + n : '' + n);\n\n  function go(n) {\n    const next = Math.max(0, Math.min(slides.length - 1, n));\n    if (next === idx && slides[idx].classList.contains('active')) return;\n    const prevIdx = idx;\n    idx = next;\n\n    // Bring the incoming slide up (cancel any pending fade-out on it).\n    const cur = slides[next];\n    clearTimeout(cur._lt);\n    cur.classList.remove('leaving');\n    cur.classList.add('active');\n\n    // Dissolve the outgoing slide out while it stays composed.\n    if (prevIdx !== next) {\n      const leaving = slides[prevIdx];\n      leaving.classList.add('leaving');\n      clearTimeout(leaving._lt);\n      leaving._lt = setTimeout(() => {\n        if (leaving.classList.contains('leaving')) {\n          leaving.classList.remove('active', 'leaving');\n        }\n      }, 560);\n    }\n    // Safety: any other slide should be fully inert.\n    slides.forEach((s, i) => {\n      if (i !== next && i !== prevIdx) { s.classList.remove('active', 'leaving'); }\n    });\n\n    counter.textContent = pad2(idx + 1) + ' / ' + pad2(slides.length);\n    prog.style.width = ((idx + 1) / slides.length * 100) + '%';\n    try { window.parent.postMessage({ slideIndexChanged: idx }, '*'); } catch (_) {}\n    if (location.hash !== '#' + (idx + 1)) history.replaceState(null, '', '#' + (idx + 1));\n    // Slide 3's research question types itself in as the gap line resolves.\n    if (slides[next].classList.contains('s3')) activateS3();\n    // Defer the globe build out of the synchronous call stack. During the\n    // initial go() (when the deck loads directly on slide 8/9) the globe\n    // module's data and helpers further down the script are not defined yet;\n    // a 0ms timeout lets the whole script finish parsing first. Idempotent.\n    if (idx === slides.length - 1 || slides[idx].id === 's8') setTimeout(ensureGlobe, 0);\n  }\n  window.go = go;\n\n  window.addEventListener('keydown', (e) => {\n    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(idx + 1); }\n    else if (e.key === 'ArrowLeft' || e.key === 'PageUp')                { e.preventDefault(); go(idx - 1); }\n    else if (e.key === 'Home')                                            { go(0); }\n    else if (e.key === 'End')                                             { go(slides.length - 1); }\n    else if (e.key === 'f' || e.key === 'F') {\n      if (!document.fullscreenElement) document.documentElement.requestFullscreen();\n      else document.exitFullscreen();\n    }\n  });\n\n  document.addEventListener('click', (e) => {\n    if (e.target.closest('.nav-hint, .counter, .globe-toggle')) return;\n    const x = e.clientX / window.innerWidth;\n    if (x > 0.5) go(idx + 1); else go(idx - 1);\n  });\n\n  // Globe state — declared BEFORE the initial go() runs, because go() may call\n  // ensureGlobe() during init when the deck first loads directly on slide 8 or 9.\n  let globeReady = false;     // 2D built (cheap, no dependency)\n  let globe3DReady = false;   // 3D successfully initialised\n  let globe3DPoll = null;     // polling timer while we wait for THREE\n  let forced2D = false;       // user/URL explicitly chose 2D\n  const s8 = document.getElementById('s8');\n  const g3d = document.getElementById('g3d');\n  const g2d = document.getElementById('g2d');\n\n  /* ==================================================================\n     Slide 3 research-question typewriter.\n     Declared BEFORE the initial go() so the activation hook is safe even\n     when the deck first loads directly on slide 3.\n     ================================================================== */\n  // Human typing rhythm. Variable keystroke timing, longer pauses at commas\n  // and full stops, the odd brief mid-phrase hesitation. Reads like a person\n  // typing, not a machine printing. Returns the pause (ms) to wait AFTER `ch`.\n  function humanDelay(ch) {\n    let d = 26 + Math.random() * 34;                                                   // base keystroke 26-60ms\n    if (ch === ' ') d += Math.random() * 50;                                           // small inter-word breath\n    if (ch === ',' || ch === ';' || ch === ':') d += 230 + Math.random() * 180;        // clause pause\n    else if (ch === '.' || ch === '?' || ch === '!') d += 380 + Math.random() * 260;   // sentence pause\n    else if (Math.random() < 0.05) d += 160 + Math.random() * 220;                      // occasional hesitation\n    return d;\n  }\n  let s3Timers = [];\n  let s3TypeTimer = null;\n\n  function buildTypewriter(h1) {\n    if (h1._twChars) return;\n    // Capture the existing content as segments, preserving the .mark span\n    // (and its inline colour) so marked characters keep their treatment.\n    const segs = [];\n    h1.childNodes.forEach(node => {\n      if (node.nodeType === 3) segs.push({ text: node.textContent, mark: false, color: '' });\n      else if (node.nodeType === 1) segs.push({ text: node.textContent, mark: node.classList.contains('mark'), color: node.style.color || '' });\n    });\n    h1.textContent = '';\n    const chars = [];\n    segs.forEach(seg => {\n      for (const ch of seg.text) {\n        const span = document.createElement('span');\n        span.className = 'tw-char' + (seg.mark ? ' mark' : '');\n        if (seg.color) span.style.color = seg.color;\n        span.textContent = ch;\n        h1.appendChild(span);\n        chars.push(span);\n      }\n    });\n    h1._twChars = chars;\n  }\n\n  function typeQuestion() {\n    const h1 = document.querySelector('.s3 .question');\n    if (!h1 || !h1._twChars) return;\n    const chars = h1._twChars;\n    clearTimeout(s3TypeTimer);\n    h1.classList.add('typing');\n    if (document.body.classList.contains('no-motion')) {\n      chars.forEach(c => c.classList.add('on'));\n      return;\n    }\n    let i = 0;\n    function step() {\n      if (i > 0) chars[i - 1].classList.remove('cursor');\n      if (i >= chars.length) return;   // done: caret removed, text holds static and legible\n      const span = chars[i];\n      span.classList.add('on', 'cursor');\n      const ch = span.textContent;\n      i++;\n      s3TypeTimer = setTimeout(step, humanDelay(ch));\n    }\n    step();\n  }\n\n  function activateS3() {\n    const h1 = document.querySelector('.s3 .question');\n    if (!h1) return;\n    buildTypewriter(h1);\n    s3Timers.forEach(clearTimeout); s3Timers = [];\n    clearTimeout(s3TypeTimer);\n    // Reset to the pre-typed state so the gap-line motion resolves into it.\n    h1.classList.remove('typing');\n    h1._twChars.forEach(c => c.classList.remove('on', 'cursor'));\n    if (document.body.classList.contains('no-motion')) { typeQuestion(); return; }\n    // Begin typing as the gap line fades out (its fade-out lands ~2400ms).\n    s3Timers.push(setTimeout(typeQuestion, 2050));\n  }\n\n  const initial = parseInt((location.hash || '').slice(1), 10);\n  go(Number.isFinite(initial) && initial > 0 ? initial - 1 : 0);\n\n  // Build the globe eagerly so it is always present on slide 8, no matter\n  // how that slide is reached (direct hash, arrow nav, or thumbnail jump).\n  setTimeout(() => { try { ensureGlobe(); } catch (_) {} }, 250);\n\n  /* ==================================================================\n     Slide 8 globe — 3D (Three.js) with 2D equirectangular fallback\n     ------------------------------------------------------------------\n     Visual approach (intentionally diagrammatic, not photoreal):\n       - Solid warm sphere in the base colour\n       - Continent outlines drawn as crisp ink polylines (procedurally\n         placed dots clustered roughly inside continent bounding paths)\n       - A faint graticule (latitude/longitude lines) overlays\n       - Three accent markers at Wales, Brazil, Lishui (Zhejiang) China\n         with pulsing halos. HTML labels project onto the canvas and\n         hide when the marker rotates to the far side.\n       - The sphere rotates slowly. A subtle \"settle\" easing brings the\n         three points round in turn during the slide's first 20 seconds.\n\n     To switch to the 2D fallback at runtime:\n       - Click the 3D / 2D buttons in the bottom-left of slide 8, OR\n       - Open the page with ?globe=2d in the URL.\n     ================================================================== */\n\n  const POINTS = [\n    { name: 'Wales',  lat:  52.13, lng:  -3.78 },\n    { name: 'Brazil', lat: -14.00, lng: -51.92 },\n    { name: 'Lishui', lat:  28.47, lng: 119.92 },\n  ];\n  const ACCENT_HEX = 0x656565;\n\n  // Continent paths — rough lat/lng polygons.  Used both to texture the\n  // 3D globe and to draw the 2D fallback map.  Coordinates are\n  // [latitude, longitude] pairs, hand-rolled to give recognisable but\n  // simplified continent silhouettes that fit the Swiss aesthetic.\n  const CONTINENTS = [\n    // North America\n    [[72,-156],[71,-130],[68,-110],[60,-95],[52,-82],[48,-66],[44,-60],[38,-74],[28,-79],[22,-87],[18,-92],[16,-95],[18,-103],[24,-110],[32,-117],[44,-124],[55,-131],[60,-145],[66,-160],[72,-167],[72,-156]],\n    // Central America link\n    [[18,-94],[14,-87],[10,-83],[8,-78],[10,-72],[12,-71],[16,-86],[18,-94]],\n    // South America\n    [[12,-72],[10,-60],[6,-50],[0,-50],[-4,-35],[-13,-39],[-23,-43],[-35,-58],[-44,-65],[-55,-67],[-52,-72],[-38,-73],[-18,-72],[-5,-80],[5,-78],[12,-72]],\n    // Greenland\n    [[83,-30],[80,-15],[75,-20],[67,-30],[63,-45],[68,-55],[78,-55],[83,-40],[83,-30]],\n    // Europe + UK (combined silhouette)\n    [[71,28],[68,40],[60,28],[58,12],[55,8],[54,14],[51,7],[48,-2],[44,-9],[40,-9],[37,-6],[36,-2],[37,5],[40,15],[42,16],[44,12],[46,14],[44,22],[42,28],[40,28],[37,28],[36,33],[40,38],[45,40],[55,40],[63,40],[71,28]],\n    // British Isles (separate small)\n    [[58,-3],[55,2],[51,2],[50,-3],[51,-6],[55,-7],[58,-5],[58,-3]],\n    // Africa\n    [[36,-5],[37,10],[33,25],[30,32],[22,37],[12,43],[10,51],[2,42],[-10,40],[-22,35],[-34,18],[-30,14],[-15,11],[-5,9],[5,-2],[6,-8],[12,-16],[20,-17],[28,-12],[34,-7],[36,-5]],\n    // Arabia\n    [[30,34],[28,48],[20,55],[12,52],[16,42],[22,38],[30,34]],\n    // Eurasia (Russia + central Asia + east Asia)\n    [[71,60],[73,80],[75,105],[74,130],[68,160],[60,175],[52,160],[46,140],[40,140],[35,130],[30,122],[24,118],[22,108],[14,103],[10,98],[18,90],[22,80],[28,75],[32,72],[36,70],[40,55],[45,50],[55,55],[60,50],[65,55],[71,60]],\n    // India\n    [[34,77],[28,88],[22,92],[14,80],[8,77],[18,72],[24,68],[30,72],[34,77]],\n    // Indochina\n    [[24,98],[18,100],[10,104],[6,102],[12,98],[18,96],[24,98]],\n    // Japan\n    [[45,141],[40,140],[35,136],[34,130],[40,138],[45,141]],\n    // Indonesia (rough cluster)\n    [[2,96],[-2,100],[-6,106],[-8,114],[-9,124],[-3,128],[2,114],[3,104],[2,96]],\n    // Australia\n    [[-12,131],[-12,142],[-18,146],[-26,153],[-34,151],[-38,146],[-37,140],[-35,135],[-32,126],[-27,114],[-22,114],[-15,123],[-12,131]],\n    // New Zealand\n    [[-35,173],[-41,174],[-46,168],[-43,170],[-37,175],[-35,173]],\n    // Antarctica (top edge only — we don't draw the south pole)\n    [[-62,-60],[-65,-30],[-67,0],[-67,40],[-65,80],[-67,120],[-65,160],[-62,170],[-62,-60]],\n  ];\n\n  function latLngToVec3(lat, lng, r) {\n    const phi   = (90 - lat) * Math.PI / 180;\n    const theta = (lng + 180) * Math.PI / 180;\n    return new THREE.Vector3(\n      -r * Math.sin(phi) * Math.cos(theta),\n       r * Math.cos(phi),\n       r * Math.sin(phi) * Math.sin(theta)\n    );\n  }\n\n  function ensureGlobe() {\n    // 2D map has no external dependency — build it once, immediately.\n    if (!globeReady) {\n      globeReady = true;\n      try { initGlobe2D(); } catch (err) { console.warn('Globe 2D build failed.', err); }\n    }\n    // Attempt 3D. If THREE has not loaded yet, wait for it rather than\n    // giving up — the CDN script may still be in flight on a slow network.\n    if (!forced2D) tryInit3D();\n  }\n\n  function tryInit3D() {\n    if (globe3DReady) return;\n    if (typeof THREE !== 'undefined') {\n      try { initGlobe3D(); globe3DReady = true; if (!forced2D) setMode('3d'); }\n      catch (err) { console.warn('Globe 3D unavailable, using 2D fallback.', err); lockTo2D(); }\n      return;\n    }\n    // THREE not ready yet — poll for it (and listen for the fallback-CDN event).\n    if (globe3DPoll) return;\n    window.addEventListener('three-loaded', tryInit3D, { once: true });\n    let waited = 0;\n    globe3DPoll = setInterval(() => {\n      waited += 150;\n      if (typeof THREE !== 'undefined') {\n        clearInterval(globe3DPoll); globe3DPoll = null;\n        try { initGlobe3D(); globe3DReady = true; if (!forced2D) setMode('3d'); }\n        catch (err) { console.warn('Globe 3D unavailable, using 2D fallback.', err); lockTo2D(); }\n      } else if (waited >= 12000) {\n        clearInterval(globe3DPoll); globe3DPoll = null;\n        console.warn('THREE failed to load within 12s; using 2D fallback.');\n        lockTo2D();\n      }\n    }, 150);\n  }\n\n  /* ---------------- 3D GLOBE ----------------------------------- */\n  let three = null;  // { scene, camera, renderer, sphere, markers, raf }\n\n  function initGlobe3D() {\n    if (typeof THREE === 'undefined') throw new Error('THREE not loaded');\n    const canvas = document.getElementById('globe-canvas');\n    const labelsEl = document.getElementById('globe-labels');\n    const SIZE = (document.getElementById('globe-area')?.offsetWidth) || 600;\n\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n    renderer.setSize(SIZE, SIZE, false);\n\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);\n    camera.position.set(0, 0, 3.6);\n\n    // Build a procedural canvas-texture for the sphere: warm base, then\n    // dotted continents, then a thin graticule overlay.\n    const tex = buildGlobeTexture();\n    const sphereGeom = new THREE.SphereGeometry(1, 96, 96);\n    const sphereMat  = new THREE.MeshBasicMaterial({ map: tex });\n    const sphere = new THREE.Mesh(sphereGeom, sphereMat);\n    // Tilt the globe forward and down so Wales (52°N) sits clearly within the\n    // visible face as it rotates in, rather than riding over the top edge.\n    // All three markers stay on the near face when each turns to the camera.\n    sphere.rotation.z = 0.18;\n    sphere.rotation.x = 0.34;\n    scene.add(sphere);\n\n    // Thin outline ring on the silhouette edge — a Swiss touch\n    const ringGeom = new THREE.RingGeometry(1.002, 1.012, 128);\n    const ringMat  = new THREE.MeshBasicMaterial({ color: 0x15110C, transparent: true, opacity: 0.16, side: THREE.DoubleSide });\n    const ring = new THREE.Mesh(ringGeom, ringMat);\n    ring.lookAt(camera.position);\n    scene.add(ring);\n\n    // Markers\n    const markers = POINTS.map(p => {\n      const pos = latLngToVec3(p.lat, p.lng, 1.005);\n      const group = new THREE.Group();\n\n      const dotGeom = new THREE.SphereGeometry(0.022, 16, 16);\n      const dotMat  = new THREE.MeshBasicMaterial({ color: ACCENT_HEX });\n      const dot = new THREE.Mesh(dotGeom, dotMat);\n      group.add(dot);\n\n      // Halo, scales with sin() each frame\n      const haloGeom = new THREE.SphereGeometry(0.038, 16, 16);\n      const haloMat  = new THREE.MeshBasicMaterial({ color: ACCENT_HEX, transparent: true, opacity: 0.35 });\n      const halo = new THREE.Mesh(haloGeom, haloMat);\n      group.add(halo);\n\n      group.position.copy(pos);\n      // Orient outward\n      group.lookAt(pos.clone().multiplyScalar(2));\n      sphere.add(group);\n\n      // HTML label\n      const el = document.createElement('div');\n      el.className = 'glabel';\n      el.textContent = p.name;\n      labelsEl.appendChild(el);\n\n      return { p, pos, group, halo, el };\n    });\n\n    three = { scene, camera, renderer, sphere, markers, t0: performance.now() };\n\n    function animate(t) {\n      if (!three) return;\n      const dt = (t - three.t0) / 1000;\n      // Slow continuous rotation, with a gentle longitudinal sway that\n      // brings each marker round in roughly 8s intervals.\n      sphere.rotation.y = dt * 0.18;\n      // Halo pulse\n      const pulseScale = 1 + 0.35 * (0.5 + 0.5 * Math.sin(dt * 2.4));\n      markers.forEach(m => {\n        m.halo.scale.setScalar(pulseScale);\n        m.halo.material.opacity = 0.45 * (1 - (pulseScale - 1) / 0.7);\n      });\n\n      renderer.render(scene, camera);\n      updateLabels();\n      three.raf = requestAnimationFrame(animate);\n    }\n\n    function updateLabels() {\n      const rect = canvas.getBoundingClientRect();\n      const w = rect.width, h = rect.height;\n      const camWorldPos = camera.position.clone();\n      markers.forEach(m => {\n        const world = m.pos.clone().applyMatrix4(sphere.matrixWorld);\n        const toCam = camWorldPos.clone().sub(world).normalize();\n        const normal = world.clone().normalize();\n        const dot = normal.dot(toCam);\n        const projected = world.clone().project(camera);\n        const x = (projected.x * 0.5 + 0.5) * w;\n        const y = (1 - (projected.y * 0.5 + 0.5)) * h;\n        m.el.style.left = x + 'px';\n        m.el.style.top  = (y - 18) + 'px';\n        // Hide labels for markers facing away from the camera, fade\n        // in the rest based on how \"head-on\" they are.\n        const visible = dot > 0.1;\n        m.el.style.opacity = visible ? Math.min(1, (dot - 0.1) * 2.4) : 0;\n      });\n    }\n\n    three.raf = requestAnimationFrame(animate);\n  }\n\n  function buildGlobeTexture() {\n    const canvas = document.createElement('canvas');\n    const W2 = 2048, H2 = 1024;\n    canvas.width = W2; canvas.height = H2;\n    const ctx = canvas.getContext('2d');\n\n    // Base: warm paper\n    ctx.fillStyle = '#EFEBE2';\n    ctx.fillRect(0, 0, W2, H2);\n\n    // Equirectangular projection helpers\n    const toX = lng => (lng + 180) / 360 * W2;\n    const toY = lat => (90 - lat) / 180 * H2;\n\n    // Continents drawn as soft fills + dotted overlays\n    ctx.save();\n    CONTINENTS.forEach(poly => {\n      ctx.beginPath();\n      poly.forEach(([lat, lng], i) => {\n        const x = toX(lng), y = toY(lat);\n        if (i === 0) ctx.moveTo(x, y);\n        else ctx.lineTo(x, y);\n      });\n      ctx.closePath();\n      ctx.fillStyle = '#D9CFBE';\n      ctx.fill();\n    });\n    ctx.restore();\n\n    // Dotted texture inside continents — gives a Swiss diagrammatic feel.\n    // Sample a grid; if the sample falls inside a continent polygon,\n    // place a small ink dot at that position.\n    ctx.fillStyle = '#15110C';\n    const STEP_LAT = 3.5;\n    const STEP_LNG = 3.5;\n    for (let lat = -82; lat <= 82; lat += STEP_LAT) {\n      // Compress longitude step near poles for visual density\n      const lngStep = STEP_LNG / Math.max(0.18, Math.cos(lat * Math.PI / 180));\n      for (let lng = -180; lng <= 180; lng += lngStep) {\n        if (pointInAnyPolygon(lat, lng, CONTINENTS)) {\n          const x = toX(lng), y = toY(lat);\n          ctx.beginPath();\n          ctx.arc(x, y, 2.4, 0, Math.PI * 2);\n          ctx.fill();\n        }\n      }\n    }\n\n    // Faint graticule\n    ctx.strokeStyle = 'rgba(21,17,12,0.10)';\n    ctx.lineWidth = 1;\n    for (let lat = -60; lat <= 60; lat += 15) {\n      ctx.beginPath();\n      ctx.moveTo(0, toY(lat));\n      ctx.lineTo(W2, toY(lat));\n      ctx.stroke();\n    }\n    for (let lng = -180; lng <= 180; lng += 15) {\n      ctx.beginPath();\n      ctx.moveTo(toX(lng), 0);\n      ctx.lineTo(toX(lng), H2);\n      ctx.stroke();\n    }\n\n    const tex = new THREE.CanvasTexture(canvas);\n    tex.colorSpace = THREE.SRGBColorSpace;\n    tex.minFilter = THREE.LinearFilter;\n    tex.magFilter = THREE.LinearFilter;\n    tex.needsUpdate = true;\n    return tex;\n  }\n\n  // Point-in-polygon test (ray casting), for lat/lng polygons.\n  function pointInAnyPolygon(lat, lng, polys) {\n    for (let i = 0; i < polys.length; i++) {\n      if (pointInPolygon(lat, lng, polys[i])) return true;\n    }\n    return false;\n  }\n  function pointInPolygon(lat, lng, poly) {\n    let inside = false;\n    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {\n      const [yi, xi] = poly[i];\n      const [yj, xj] = poly[j];\n      const intersect = ((yi > lat) !== (yj > lat)) &&\n                        (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-9) + xi);\n      if (intersect) inside = !inside;\n    }\n    return inside;\n  }\n\n  /* ---------------- 2D GLOBE FALLBACK -------------------------- */\n  function initGlobe2D() {\n    const svg = document.getElementById('globe-2d');\n    if (!svg) return;\n    const NS = 'http://www.w3.org/2000/svg';\n    const VB = 460;\n    const mapW = 460, mapH = 230;\n    const offsetY = (VB - mapH) / 2;\n\n    // Faint frame\n    const frame = document.createElementNS(NS, 'rect');\n    frame.setAttribute('x', '0');\n    frame.setAttribute('y', String(offsetY));\n    frame.setAttribute('width', String(mapW));\n    frame.setAttribute('height', String(mapH));\n    frame.setAttribute('fill', '#E8E2D5');\n    svg.appendChild(frame);\n\n    // Graticule\n    const gG = document.createElementNS(NS, 'g');\n    gG.setAttribute('stroke', 'rgba(21,17,12,0.10)');\n    gG.setAttribute('stroke-width', '1');\n    for (let lat = -45; lat <= 60; lat += 15) {\n      const y = offsetY + (70 - lat) / (70 - (-60)) * mapH;\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('x1', '0'); ln.setAttribute('x2', String(mapW));\n      ln.setAttribute('y1', String(y)); ln.setAttribute('y2', String(y));\n      gG.appendChild(ln);\n    }\n    for (let lng = -150; lng <= 150; lng += 30) {\n      const x = (lng + 180) / 360 * mapW;\n      const ln = document.createElementNS(NS, 'line');\n      ln.setAttribute('y1', String(offsetY)); ln.setAttribute('y2', String(offsetY + mapH));\n      ln.setAttribute('x1', String(x)); ln.setAttribute('x2', String(x));\n      gG.appendChild(ln);\n    }\n    svg.appendChild(gG);\n\n    // Continents\n    const projX = lng => (lng + 180) / 360 * mapW;\n    const projY = lat => offsetY + (70 - lat) / (70 - (-60)) * mapH;\n    CONTINENTS.forEach(poly => {\n      const d = poly.map(([lat, lng], i) => (i === 0 ? 'M' : 'L') + projX(lng).toFixed(1) + ' ' + projY(lat).toFixed(1)).join(' ') + ' Z';\n      const path = document.createElementNS(NS, 'path');\n      path.setAttribute('d', d);\n      path.setAttribute('fill', '#D9CFBE');\n      path.setAttribute('stroke', 'rgba(21,17,12,0.30)');\n      path.setAttribute('stroke-width', '0.6');\n      svg.appendChild(path);\n    });\n\n    // Dotted overlay over land — same density as 3D for visual coherence\n    const dotsG = document.createElementNS(NS, 'g');\n    dotsG.setAttribute('fill', '#15110C');\n    const STEP_LAT = 4.5, STEP_LNG = 4.5;\n    for (let lat = -55; lat <= 70; lat += STEP_LAT) {\n      const lngStep = STEP_LNG / Math.max(0.4, Math.cos(lat * Math.PI / 180));\n      for (let lng = -180; lng <= 180; lng += lngStep) {\n        if (pointInAnyPolygon(lat, lng, CONTINENTS)) {\n          const c = document.createElementNS(NS, 'circle');\n          c.setAttribute('cx', projX(lng).toFixed(1));\n          c.setAttribute('cy', projY(lat).toFixed(1));\n          c.setAttribute('r', '1.2');\n          dotsG.appendChild(c);\n        }\n      }\n    }\n    svg.appendChild(dotsG);\n\n    // Markers with pulsing halos\n    POINTS.forEach(p => {\n      const cx = projX(p.lng), cy = projY(p.lat);\n\n      const halo = document.createElementNS(NS, 'circle');\n      halo.setAttribute('cx', String(cx));\n      halo.setAttribute('cy', String(cy));\n      halo.setAttribute('r', '5');\n      halo.setAttribute('fill', 'none');\n      halo.setAttribute('stroke', '#656565');\n      halo.setAttribute('stroke-width', '1.5');\n      halo.setAttribute('opacity', '0.55');\n      // Animate via SMIL\n      const animR = document.createElementNS(NS, 'animate');\n      animR.setAttribute('attributeName', 'r');\n      animR.setAttribute('from', '5'); animR.setAttribute('to', '14');\n      animR.setAttribute('dur', '2.2s'); animR.setAttribute('repeatCount', 'indefinite');\n      const animO = document.createElementNS(NS, 'animate');\n      animO.setAttribute('attributeName', 'opacity');\n      animO.setAttribute('from', '0.55'); animO.setAttribute('to', '0');\n      animO.setAttribute('dur', '2.2s'); animO.setAttribute('repeatCount', 'indefinite');\n      halo.appendChild(animR); halo.appendChild(animO);\n      svg.appendChild(halo);\n\n      const dot = document.createElementNS(NS, 'circle');\n      dot.setAttribute('cx', String(cx));\n      dot.setAttribute('cy', String(cy));\n      dot.setAttribute('r', '4');\n      dot.setAttribute('fill', '#656565');\n      svg.appendChild(dot);\n\n      const label = document.createElementNS(NS, 'text');\n      label.setAttribute('x', String(cx + 8));\n      label.setAttribute('y', String(cy - 8));\n      label.setAttribute('fill', '#656565');\n      label.setAttribute('font-family', 'Inter, sans-serif');\n      label.setAttribute('font-size', '12');\n      label.setAttribute('font-weight', '500');\n      label.textContent = p.name;\n      svg.appendChild(label);\n    });\n  }\n\n  /* ---------------- Toggle 3D / 2D ----------------------------- */\n  function setMode(mode) {\n    if (mode === '2d') {\n      s8.classList.add('mode-2d');\n      g3d.classList.remove('on');\n      g2d.classList.add('on');\n      document.getElementById('globe-labels').style.display = 'none';\n    } else {\n      s8.classList.remove('mode-2d');\n      g3d.classList.add('on');\n      g2d.classList.remove('on');\n      document.getElementById('globe-labels').style.display = '';\n    }\n  }\n  function lockTo2D() {\n    setMode('2d');\n    if (g3d) g3d.disabled = true;\n    if (g3d) g3d.style.opacity = '0.4';\n    if (g3d) g3d.title = '3D globe unavailable in this environment';\n  }\n  if (g2d) g2d.addEventListener('click', () => { forced2D = true; setMode('2d'); });\n  if (g3d) g3d.addEventListener('click', () => { forced2D = false; setMode('3d'); tryInit3D(); });\n\n  // Honour ?globe=2d URL parameter\n  const urlParams = new URLSearchParams(location.search);\n  if (urlParams.get('globe') === '2d') {\n    forced2D = true;\n    // Defer until slide 8 ever activates and globe init runs\n    const lockOn8 = () => { ensureGlobe(); lockTo2D(); };\n    // If already on slide 8, lock immediately; else wait for navigation.\n    if (slides[idx] && slides[idx].id === 's8') lockOn8();\n    else {\n      const orig = go;\n      // (We don't redefine go; instead, listen for slide changes via the\n      // postMessage we already send to parent — simplest: poll once.)\n      const obs = new MutationObserver(() => {\n        if (slides.find(s => s.classList.contains('active'))?.id === 's8') {\n          lockOn8(); obs.disconnect();\n        }\n      });\n      slides.forEach(s => obs.observe(s, { attributes: true, attributeFilter: ['class'] }));\n    }\n  }\n<\u002Fscript>\n\n<!-- ============================================================\n     TWEAKS PANEL  (in-page, host-protocol wired)\n     ============================================================ -->\n<style>\n  #tweaks-panel {\n    position: fixed; top: 18px; right: 18px; z-index: 500; width: 292px;\n    background: #F5F2EB; color: #15110C;\n    border: 1px solid #6B6157; display: none;\n    font-family: \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n    box-shadow: 0 16px 50px rgba(0,0,0,0.22);\n  }\n  body.tweaks-on #tweaks-panel { display: block; }\n  #tweaks-panel .tp-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 13px 16px; border-bottom: 1px solid #6B6157;\n  }\n  #tweaks-panel .tp-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.24em; font-weight: 700; }\n  #tweaks-panel .tp-close { cursor: pointer; background: none; border: none; color: #6B6157; font-size: 21px; line-height: 1; padding: 0 2px; }\n  #tweaks-panel .tp-close:hover { color: #15110C; }\n  #tweaks-panel .tp-sec { padding: 14px 16px; border-bottom: 1px solid rgba(107,97,87,0.28); }\n  #tweaks-panel .tp-sec:last-child { border-bottom: none; }\n  #tweaks-panel .tp-lab { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; color: #6B6157; font-weight: 600; margin-bottom: 11px; }\n  #tweaks-panel .tp-sw-row { display: flex; gap: 9px; }\n  #tweaks-panel .tp-sw {\n    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;\n    border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(21,17,12,0.18);\n    transition: border-color .15s;\n  }\n  #tweaks-panel .tp-sw.on { border-color: #15110C; }\n  #tweaks-panel .tp-row { display: flex; align-items: center; justify-content: space-between; }\n  #tweaks-panel .tp-row .tp-name { font-size: 14px; font-weight: 500; }\n  #tweaks-panel .tp-seg { display: inline-flex; border: 1px solid #6B6157; border-radius: 2px; overflow: hidden; }\n  #tweaks-panel .tp-seg button {\n    background: #F5F2EB; color: #6B6157; border: none; padding: 5px 14px;\n    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; letter-spacing: 0.04em;\n  }\n  #tweaks-panel .tp-seg button.on { background: #15110C; color: #F5F2EB; }\n  .hide-numerals .big-num { display: none !important; }\n<\u002Fstyle>\n\n<div id=\"tweaks-panel\" aria-hidden=\"true\">\n  <div class=\"tp-head\">\n    <span class=\"tp-title\">Tweaks<\u002Fspan>\n    <button class=\"tp-close\" id=\"tp-close\" type=\"button\" aria-label=\"Close\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tp-sec\">\n    <div class=\"tp-lab\">Accent<\u002Fdiv>\n    <div class=\"tp-sw-row\" id=\"tp-accent\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-sec\">\n    <div class=\"tp-lab\">Paper<\u002Fdiv>\n    <div class=\"tp-sw-row\" id=\"tp-paper\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-sec\">\n    <div class=\"tp-row\">\n      <span class=\"tp-name\">Slide numerals<\u002Fspan>\n      <span class=\"tp-seg\" id=\"tp-numerals\"><button data-v=\"1\" type=\"button\">On<\u002Fbutton><button data-v=\"0\" type=\"button\">Off<\u002Fbutton><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-sec\">\n    <div class=\"tp-row\">\n      <span class=\"tp-name\">Entrance motion<\u002Fspan>\n      <span class=\"tp-seg\" id=\"tp-motion\"><button data-v=\"1\" type=\"button\">On<\u002Fbutton><button data-v=\"0\" type=\"button\">Off<\u002Fbutton><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"accent\": \"#656565\",\n    \"paper\": \"#EFEBE2\",\n    \"numerals\": true,\n    \"motion\": true\n  }/*EDITMODE-END*/;\n\n  const ACCENTS = [\"#656565\", \"#0F4C5C\", \"#2E5E3A\", \"#34556E\", \"#9A5A3C\"];\n  const PAPERS = [\n    { base: \"#EFEBE2\", base2: \"#E5E0D4\" },\n    { base: \"#F2EFE8\", base2: \"#E8E3D8\" },\n    { base: \"#ECECEA\", base2: \"#E1E1DE\" },\n    { base: \"#F0EADC\", base2: \"#E6DEC9\" }\n  ];\n  const root = document.documentElement.style;\n\n  function applyAccent(hex){ root.setProperty('--accent', hex); root.setProperty('--accent-tint', hex + '14'); }\n  function applyPaper(hex){\n    const p = PAPERS.find(x => x.base.toLowerCase() === String(hex).toLowerCase()) || PAPERS[0];\n    root.setProperty('--base', p.base); root.setProperty('--base-2', p.base2);\n  }\n  function applyNumerals(on){ document.body.classList.toggle('hide-numerals', !on); }\n  function applyMotion(on){ window.__tweakMotionOff = !on; if (typeof syncMotion === 'function') syncMotion(); }\n\n  function persist(edits){ try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: edits }, '*'); } catch(_){} }\n  function markSw(row, hex){ [...row.children].forEach(c => c.classList.toggle('on', c.dataset.hex.toLowerCase() === String(hex).toLowerCase())); }\n  function markSeg(seg, v){ [...seg.children].forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === v)); }\n\n  const accentRow = document.getElementById('tp-accent');\n  ACCENTS.forEach(hex => {\n    const b = document.createElement('div'); b.className = 'tp-sw'; b.style.background = hex; b.dataset.hex = hex;\n    b.addEventListener('click', () => { TWEAKS.accent = hex; applyAccent(hex); markSw(accentRow, hex); persist({ accent: hex }); });\n    accentRow.appendChild(b);\n  });\n  const paperRow = document.getElementById('tp-paper');\n  PAPERS.forEach(p => {\n    const b = document.createElement('div'); b.className = 'tp-sw'; b.style.background = p.base; b.dataset.hex = p.base;\n    b.addEventListener('click', () => { TWEAKS.paper = p.base; applyPaper(p.base); markSw(paperRow, p.base); persist({ paper: p.base }); });\n    paperRow.appendChild(b);\n  });\n\n  function wireSeg(id, key, apply){\n    const seg = document.getElementById(id);\n    [...seg.children].forEach(btn => {\n      btn.addEventListener('click', () => { const v = btn.dataset.v === '1'; TWEAKS[key] = v; apply(v); markSeg(seg, v); persist({ [key]: v }); });\n    });\n    return seg;\n  }\n  const numSeg = wireSeg('tp-numerals', 'numerals', applyNumerals);\n  const motSeg = wireSeg('tp-motion', 'motion', applyMotion);\n\n  // Apply persisted defaults on load\n  applyAccent(TWEAKS.accent); markSw(accentRow, TWEAKS.accent);\n  applyPaper(TWEAKS.paper); markSw(paperRow, TWEAKS.paper);\n  applyNumerals(TWEAKS.numerals); markSeg(numSeg, TWEAKS.numerals);\n  applyMotion(TWEAKS.motion); markSeg(motSeg, TWEAKS.motion);\n\n  // Keep panel clicks from triggering the deck's click-to-navigate.\n  document.getElementById('tweaks-panel').addEventListener('click', e => e.stopPropagation());\n\n  // Host protocol — register the listener BEFORE announcing availability.\n  window.addEventListener('message', (e) => {\n    const t = e.data && e.data.type;\n    if (t === '__activate_edit_mode') document.body.classList.add('tweaks-on');\n    else if (t === '__deactivate_edit_mode') document.body.classList.remove('tweaks-on');\n  });\n  document.getElementById('tp-close').addEventListener('click', () => {\n    document.body.classList.remove('tweaks-on');\n    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(_){}\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(_){}\n})();\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
